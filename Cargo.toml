[package]
name = "incident-clustering-analyzer"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
calamine = "0.26"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
futures-util = "0.3"
http = "1.3"
http-body-util = "0.1"
hyper = { version = "1.9", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rayon = "1.10"
rust_xlsxwriter = "0.94"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

# Obsolete dependencies to gpui and file dialogs (commented out for future reference)
# gpui = "0.2.2"
# gpui-component = "0.5.1"
# rfd = "0.15"

[dev-dependencies]
tempfile = "3.14"
